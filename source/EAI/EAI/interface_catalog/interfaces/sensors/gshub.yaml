id: sensor.gshub
name: GS-Hub
category: sensor
models: [gshub, gs-hub, gs_hub]
description: Stereo camera, point cloud, odometry, and scan interfaces published by GS-Hub.
interfaces:
  - id: ros.gshub.left_image
    name: Left camera image
    protocol: ros2
    direction: output
    kind: topic
    endpoint: /{robot}/GS_Hub_L_cam
    data_type: sensor_msgs/msg/Image
    description: Left GS-Hub image stream.
    example: ros2 topic echo --once /{robot}/GS_Hub_L_cam
    requires_attachment: camera
    read_only_test: {type: ros_topic}
  - id: ros.gshub.right_image
    name: Right camera image
    protocol: ros2
    direction: output
    kind: topic
    endpoint: /{robot}/GS_Hub_R_cam
    data_type: sensor_msgs/msg/Image
    description: Right GS-Hub image stream.
    example: ros2 topic echo --once /{robot}/GS_Hub_R_cam
    requires_attachment: camera
    read_only_test: {type: ros_topic}
  - id: ros.gshub.point_cloud
    name: Point cloud
    protocol: ros2
    direction: output
    kind: topic
    endpoint: /{robot}/cloud
    data_type: sensor_msgs/msg/PointCloud2
    description: Registered GS-Hub point cloud output.
    example: ros2 topic echo --once /{robot}/cloud
    requires_attachment: ros
    read_only_test: {type: ros_topic}
  - id: ros.gshub.odometry
    name: Odometry
    protocol: ros2
    direction: output
    kind: topic
    endpoint: /{robot}/odometry
    data_type: nav_msgs/msg/Odometry
    description: GS-Hub odometry output.
    example: ros2 topic echo --once /{robot}/odometry
    requires_attachment: ros
    read_only_test: {type: ros_topic}
  - id: ros.gshub.scan
    name: Derived laser scan
    protocol: ros2
    direction: output
    kind: topic
    endpoint: /{robot}/scan
    data_type: sensor_msgs/msg/LaserScan
    description: LaserScan derived by the navigation pipeline from the point cloud.
    example: ros2 topic echo --once /{robot}/scan
    requires_attachment: ros
    read_only_test: {type: ros_topic}
