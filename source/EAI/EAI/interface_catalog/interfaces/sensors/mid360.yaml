id: sensor.mid360
name: Livox Mid-360 (idealized)
category: sensor
models: [mid360]
description: SimpleCar built-in Mid-360 variant; idealized 16-emitter RTX lidar with the production 20 deg forward pitch, plus synthesized IMU runtime.
mount_frame: base_footprint
mount_translation_m: [0.0, 0.0, 0.61459]
mount_rpy_rad: [0.0, 0.349066, 0.0]
imu_offset_ros_m: [0.0189, -0.02464, -0.0535]
interfaces:
  - id: ros.mid360.point_cloud
    name: Mid-360 point cloud
    protocol: ros2
    direction: output
    kind: topic
    endpoint: /{robot}/cloud
    data_type: sensor_msgs/msg/PointCloud2
    description: Idealized Mid-360 point cloud matching the production mounting pitch; declared via the simple_car mid360 attachment.
    example: ros2 topic echo --once /{robot}/cloud
    requires_attachment: navigation_io
    nominal_rate_hz: 10
    frame_id: '{robot}/lidar_link'
    horizontal_fov_deg: 360
    vertical_fov_deg: [-7, 53]
    range_m: [0.10, 130.0]
    points_per_second: 56000
    read_only_test: {type: ros_topic}
  - id: ros.mid360.velodyne_points
    name: Gazebo point-cloud compatibility alias
    protocol: ros2
    direction: output
    kind: topic
    endpoint: /{robot}/velodyne_points
    data_type: sensor_msgs/msg/PointCloud2
    description: Compatibility alias carrying the same Mid-360 point cloud as /cloud.
    example: ros2 topic echo --once /{robot}/velodyne_points
    requires_attachment: navigation_io
    nominal_rate_hz: 10
    frame_id: '{robot}/lidar_link'
    read_only_test: {type: ros_topic}
  - id: ros.mid360.imu
    name: Mid-360 host IMU
    protocol: ros2
    direction: output
    kind: topic
    endpoint: /{robot}/sensors/imu
    data_type: sensor_msgs/msg/Imu
    description: Physics-tick synthesized host kinematics published in the shared sensor-suite IMU frame.
    example: ros2 topic echo --once /{robot}/sensors/imu
    requires_attachment: navigation_io
    nominal_rate_hz: 200
    frame_id: '{robot}/imu_link'
    read_only_test: {type: ros_topic}
  - id: ros.mid360.odometry
    name: Simulator odometry
    protocol: ros2
    direction: output
    kind: topic
    endpoint: /{robot}/odometry
    data_type: nav_msgs/msg/Odometry
    description: Simulator ground-truth odometry of the simple_car base_footprint rigid body; it is not a Mid-360 sensor output.
    example: ros2 topic echo --once /{robot}/odometry
    requires_attachment: navigation_io
    nominal_rate_hz: 200
    frame_id: '{robot}/odom'
    child_frame_id: '{robot}/base_footprint'
    read_only_test: {type: ros_topic}
