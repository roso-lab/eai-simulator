id: sensor.octagon_aio_c01
name: OCTAGON-AIO-C01
category: sensor
models: [octagon_aio_c01]
description: Detachable C01 native OmniLidar and synthesized IMU runtime; hosts mount it on their native lidar payload mount (the same placement as the standalone LiDAR payload).
mount_frame: host lidar payload mount (values below document the SimpleCar built-in reference mount)
mount_translation_m: [0.2, 0.0, 0.61459]
mount_rpy_rad: [0.0, 0.0, 0.0]
imu_offset_ros_m: [0.0189, -0.02464, -0.0535]
interfaces:
  - id: ros.octagon.point_cloud
    name: OCTAGON point cloud
    protocol: ros2
    direction: output
    kind: topic
    endpoint: /{robot}/cloud
    data_type: sensor_msgs/msg/PointCloud2
    description: C01-compatible idealized 40-emitter point cloud; the real scanner uses a non-repeating pattern.
    example: ros2 topic echo --once /{robot}/cloud
    requires_attachment: navigation_io
    nominal_rate_hz: 30
    frame_id: '{robot}/lidar_link'
    horizontal_fov_deg: 360
    vertical_fov_deg: [-15, 45]
    range_m: [0.05, 50.0]
    points_per_second: 200000
    read_only_test: {type: ros_topic}
  - id: ros.octagon.velodyne_points
    name: Gazebo point-cloud compatibility alias
    protocol: ros2
    direction: output
    kind: topic
    endpoint: /{robot}/velodyne_points
    data_type: sensor_msgs/msg/PointCloud2
    description: Compatibility alias carrying the same native C01 point cloud as /cloud.
    example: ros2 topic echo --once /{robot}/velodyne_points
    requires_attachment: navigation_io
    nominal_rate_hz: 30
    frame_id: '{robot}/lidar_link'
    read_only_test: {type: ros_topic}
  - id: ros.octagon.imu
    name: OCTAGON IMU
    protocol: ros2
    direction: output
    kind: topic
    endpoint: /{robot}/sensors/imu
    data_type: sensor_msgs/msg/Imu
    description: Physics-tick synthesized host kinematics published in the C01 IMU frame.
    example: ros2 topic echo --once /{robot}/sensors/imu
    requires_attachment: navigation_io
    nominal_rate_hz: 200
    frame_id: '{robot}/imu_link'
    read_only_test: {type: ros_topic}
  - id: ros.octagon.odometry
    name: Simulator odometry
    protocol: ros2
    direction: output
    kind: topic
    endpoint: /{robot}/odometry
    data_type: nav_msgs/msg/Odometry
    description: Simulator ground-truth odometry sampled from the host base frame (Carter Orsus_chassis_link, SimpleCar base_footprint, other hosts the articulation root); it is not a C01 sensor output.
    example: ros2 topic echo --once /{robot}/odometry
    requires_attachment: navigation_io
    nominal_rate_hz: 200
    frame_id: '{robot}/odom'
    child_frame_id: '{robot}/Orsus_chassis_link'
    read_only_test: {type: ros_topic}
