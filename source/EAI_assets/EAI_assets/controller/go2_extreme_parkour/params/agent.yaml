seed: 1
device: cuda:0
num_steps_per_env: 24
max_iterations: 6000
empirical_normalization: false
obs_groups:
  policy:
  - policy
  critic:
  - policy
clip_actions: 4.8
save_interval: 200
experiment_name: go2_extreme_parkour_v1_teacher
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: true
load_run: .*
load_checkpoint: /home/hx/go2_parkour/go2_parkour/logs/rsl_rl/go2_extreme_parkour_v1_teacher/2026-08-28_18-08-20/model_10998.pt
class_name: ExtremeParkourOnPolicyRunner
policy:
  class_name: ExtremeParkourActorCritic
  init_noise_std: 1.0
  noise_std_type: scalar
  state_dependent_std: false
  actor_obs_normalization: false
  critic_obs_normalization: false
  actor_hidden_dims:
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  scan_encoder_dims:
  - 128
  - 64
  - 32
  priv_encoder_dims:
  - 64
  - 20
  estimator_hidden_dims:
  - 128
  - 64
algorithm:
  class_name: ExtremeParkourPPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0002
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg: null
  estimator_learning_rate: 0.0001
  dagger_update_freq: 20
  priv_reg_coef_schedule:
  - 0.0
  - 0.1
  - 2000
  - 3000
  check_finite: true
