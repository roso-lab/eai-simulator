# EAI 仿真器 → Nav2 机器人与场景配置表
#
# 让 Nav2 导航能按"机器人类型 + 场景"自动适配，实现可拓展：
# 新增机器人 → 在 robot_profiles 加一条（键 = 控制器 cfg 的 robot_type 字符串）；
# 新增带地图的场景 → 在 scene_maps 加一条。
#
# 关键区分（来自代码调研）：
#   - 话题命名空间 = 机器人 articulation 实例名（keyboard.py 交互选择生成 carter_1/go2_1；
#     写死的 nav 任务是 carter_1）。话题固定为 /<实例名>/{odometry,cloud,cmd_vel,...}。
#   - 机器人"类型"= 控制器 cfg 的 robot_type 字符串（Carter/Go2/B2/Scout/...），稳定不变，
#     用它查物理参数最可靠。
# 所以 nav2_setup.py 需要两个输入：实例名(命名空间) + 机器人类型(查本表)。

# ─────────────────────────────────────────────────────────────
# 机器人物理/运动参数（按 controller cfg 的 robot_type 字符串索引）
# ─────────────────────────────────────────────────────────────
# 字段说明：
#   motion_model   : amcl 运动模型 —— differential(差速) 或 omni(全向)
#   robot_radius   : costmap 碰撞半径 (m)
#   nav_base_offset_xyz : 仿真车体原点到 Nav2 运动学基点的车体系偏移 (m)
#   footprint      : 可选，Nav2 运动学基点坐标系下的底盘轮廓；设置后替代 robot_radius
#   sensor_mounts  : 每种传感器相对 base 的安装位姿；orsus 与独立 lidar 必须分别标定
#   lidar_xyz/rpy  : 旧版 Orsus 标定兼容字段；新配置由 sensor_mounts 优先覆盖
#   max_vel_x / max_vel_theta : 最大线/角速度
#   acc_lim_x / acc_lim_theta : 线/角加速度上限
#   min_vel_x      : 最小线速度（差速 0；全向可负，允许后退）
#   min_speed_xy   : DWB 最小平移速度模长，不能为负；Go2 可倒车时仍保持 0
#   xy/yaw_goal_tolerance, progress_* : 可选 Nav2 controller 调优参数；未填则用 Carter 验证默认值
#   controller_plugin / planner_plugin : 可选车型级 Nav2 插件；Ackermann 车型不能使用原地旋转式 DWB 路径
#   minimum_turning_radius : Ackermann 最小转弯半径 (m)
#   inflation_radius : 可选 costmap 膨胀半径；未填则取 max(0.55, robot_radius)
#   scan_z_min/max : 点云→激光的高度切片（lidar_link 系，排地面/天花板）
#   scan_range_min : 点云→激光的最小有效距离，至少覆盖机器人本体半径，过滤自体回波
robot_profiles:
  Carter:
    motion_model: differential
    robot_radius: 0.35
    lidar_xyz: [0.026, 0.0, 0.418]
    lidar_rpy: [0.0, 0.339, 0.0]
    sensor_mounts:
      orsus: {xyz: [0.026, 0.0, 0.418], rpy: [0.0, 0.339, 0.0]}
      lidar: {xyz: [0.026, 0.0, 0.444862], rpy: [0.0, 0.0, 0.0]}
    max_vel_x: 0.8
    max_vel_theta: 1.5
    acc_lim_x: 2.5
    acc_lim_theta: 3.2
    min_vel_x: 0.0
    scan_z_min: 0.05
    scan_z_max: 1.50
    scan_range_min: 0.45

  Pepper:
    motion_model: omni
    robot_radius: 0.35
    sensor_mounts:
      lidar: {xyz: [0.0, 0.0, 1.45], rpy: [0.0, 0.0, 0.0]}
    max_vel_x: 0.4
    max_vel_theta: 0.8
    acc_lim_x: 1.0
    acc_lim_theta: 1.5
    min_vel_x: -0.3
    min_speed_xy: 0.0
    xy_goal_tolerance: 0.4
    yaw_goal_tolerance: 0.8
    progress_required_movement_radius: 0.05
    progress_movement_time_allowance: 30.0
    scan_z_min: -0.10
    scan_z_max: 0.50
    scan_range_min: 0.35

  Go2:
    motion_model: omni
    robot_radius: 0.30
    lidar_xyz: [0.026, 0.0, 0.0]
    lidar_rpy: [0.0, 0.339, 0.0]
    sensor_mounts:
      orsus: {xyz: [0.026, 0.0, 0.0], rpy: [0.0, 0.339, 0.0]}
      lidar: {xyz: [0.22631, -0.003, 0.136534], rpy: [0.0, 0.0, 0.0]}
    max_vel_x: 1.0
    max_vel_theta: 1.5
    acc_lim_x: 2.5
    acc_lim_theta: 3.2
    min_vel_x: -0.5
    min_speed_xy: 0.0
    xy_goal_tolerance: 0.6
    yaw_goal_tolerance: 3.14
    progress_required_movement_radius: 0.05
    progress_movement_time_allowance: 30.0
    scan_z_min: 0.05
    scan_z_max: 1.20
    scan_range_min: 0.35

  B2:
    motion_model: omni
    # Isaac USD /b2_description XY bbox ≈ x[-0.423, 0.431], y[-0.229, 0.229].
    # Circular Nav2 radius uses the outer corner (~0.488m), rounded up for gait margin.
    robot_radius: 0.50
    lidar_xyz: [0.36723, 0.0, 0.223494]
    lidar_rpy: [0.0, 0.339, 0.0]
    sensor_mounts:
      orsus: {xyz: [0.36723, 0.0, 0.223494], rpy: [0.0, 0.339, 0.0]}
      lidar: {xyz: [0.36723, 0.0, 0.2902], rpy: [0.0, 0.0, 0.0]}
    max_vel_x: 1.0
    max_vel_theta: 1.2
    acc_lim_x: 2.0
    acc_lim_theta: 3.0
    # The deployed B2 locomotion policy does not produce useful reverse motion.
    # Keep DWB forward-only so side/rear goals rotate first instead of stalling
    # on a negative linear.x command.
    min_vel_x: 0.0
    min_speed_xy: 0.0
    xy_goal_tolerance: 0.6
    yaw_goal_tolerance: 3.14
    progress_required_movement_radius: 0.05
    progress_movement_time_allowance: 30.0
    scan_z_min: 0.05
    scan_z_max: 1.50
    scan_range_min: 0.50

  Lite3:
    motion_model: omni
    # USD bbox XY radius ≈ 0.335m; rounded up for gait margin.
    robot_radius: 0.38
    lidar_xyz: [0.16669, 0.0, 0.06773]
    lidar_rpy: [0.0, 0.339, 0.0]
    sensor_mounts:
      orsus: {xyz: [0.16669, 0.0, 0.06773], rpy: [0.0, 0.339, 0.0]}
      lidar: {xyz: [0.16669, 0.0, 0.114523], rpy: [0.0, 0.0, 0.0]}
    max_vel_x: 0.8
    max_vel_theta: 1.2
    acc_lim_x: 2.0
    acc_lim_theta: 3.0
    min_vel_x: -0.5
    min_speed_xy: 0.0
    xy_goal_tolerance: 0.6
    yaw_goal_tolerance: 3.14
    progress_required_movement_radius: 0.05
    progress_movement_time_allowance: 30.0
    scan_z_min: 0.05
    scan_z_max: 1.20
    scan_range_min: 0.38

  Scout:
    motion_model: differential
    # USD bbox XY radius ≈ 0.582m; rounded up for the rectangular base.
    robot_radius: 0.60
    lidar_xyz: [0.24749, 0.0, 0.11309]
    lidar_rpy: [0.0, 0.339, 0.0]
    sensor_mounts:
      orsus: {xyz: [0.24749, 0.0, 0.11309], rpy: [0.0, 0.339, 0.0]}
      lidar: {xyz: [0.24749, 0.0, 0.160402], rpy: [0.0, 0.0, 0.0]}
    max_vel_x: 0.8
    max_vel_theta: 1.2
    acc_lim_x: 2.0
    acc_lim_theta: 2.5
    min_vel_x: 0.0
    controller_plugin: rotation_shim_dwb
    progress_required_movement_radius: 0.05
    progress_movement_time_allowance: 30.0
    scan_z_min: 0.05
    scan_z_max: 1.50
    scan_range_min: 0.60

  M20:
    motion_model: omni
    # USD bbox XY radius ≈ 0.481m; rounded up for wheel-leg gait margin.
    robot_radius: 0.50
    lidar_xyz: [0.29718, 0.0, 0.07994]
    lidar_rpy: [0.0, 0.339, 0.0]
    sensor_mounts:
      orsus: {xyz: [0.29718, 0.0, 0.07994], rpy: [0.0, 0.339, 0.0]}
      lidar: {xyz: [0.29718, 0.0, 0.121437], rpy: [0.0, 0.0, 0.0]}
    max_vel_x: 0.8
    max_vel_theta: 1.2
    acc_lim_x: 2.0
    acc_lim_theta: 3.0
    min_vel_x: -0.5
    min_speed_xy: 0.0
    xy_goal_tolerance: 0.6
    yaw_goal_tolerance: 3.14
    progress_required_movement_radius: 0.05
    progress_movement_time_allowance: 30.0
    scan_z_min: 0.05
    scan_z_max: 1.50
    scan_range_min: 0.50

  G1:
    motion_model: omni
    # Include normal arm swing around the humanoid body in the 2D footprint.
    robot_radius: 0.40
    sensor_mounts:
      lidar: {xyz: [0.0, 0.0, 0.72], rpy: [0.0, 0.0, 0.0]}
    max_vel_x: 0.4
    max_vel_theta: 0.8
    acc_lim_x: 1.0
    acc_lim_theta: 1.5
    min_vel_x: -0.2
    min_speed_xy: 0.0
    xy_goal_tolerance: 0.6
    yaw_goal_tolerance: 3.14
    progress_required_movement_radius: 0.05
    progress_movement_time_allowance: 30.0
    scan_z_min: -0.10
    scan_z_max: 0.60
    scan_range_min: 0.40

  MuSHR Nano v2:
    motion_model: differential
    # USD XY 外接圆约 0.271m；留出车轮和转弯余量。
    robot_radius: 0.30
    sensor_mounts:
      lidar: {xyz: [-0.035325, 0.0, 0.18495], rpy: [0.0, 0.0, 0.0]}
    max_vel_x: 0.8
    max_vel_theta: 1.0
    acc_lim_x: 1.5
    acc_lim_theta: 2.0
    min_vel_x: 0.0
    xy_goal_tolerance: 0.35
    yaw_goal_tolerance: 3.14
    progress_required_movement_radius: 0.05
    progress_movement_time_allowance: 30.0
    scan_z_min: 0.03
    scan_z_max: 1.00
    scan_range_min: 0.30

  Coco AIRS:
    motion_model: differential
    # 仿真 odometry 位于车体几何中心，而 Ackermann 规划/控制基点必须位于后轴。
    # USD 后轴相对车体中心 x=-0.235m；轮廓是后轴坐标下的底盘 bbox 加安全余量。
    robot_radius: 0.50
    nav_base_offset_xyz: [-0.235, 0.0, 0.0]
    footprint: [[-0.18, -0.34], [-0.18, 0.34], [0.65, 0.34], [0.65, -0.34]]
    sensor_mounts:
      orsus: {xyz: [0.0, 0.0, 0.430962], rpy: [0.0, 0.339, 0.0]}
      lidar: {xyz: [0.0, 0.0, 0.478662], rpy: [0.0, 0.0, 0.0]}
    max_vel_x: 0.6
    max_vel_theta: 0.6
    acc_lim_x: 1.0
    acc_lim_theta: 1.5
    # Smac REEDS_SHEPP paths include reverse segments. The Coco controller
    # supports negative wheel speed, so the velocity smoother must not clamp it.
    min_vel_x: -0.4
    controller_plugin: regulated_pure_pursuit
    planner_plugin: smac_hybrid
    minimum_turning_radius: 1.25
    allow_reversing: true
    desired_linear_vel: 0.4
    xy_goal_tolerance: 0.6
    yaw_goal_tolerance: 3.14
    progress_required_movement_radius: 0.05
    progress_movement_time_allowance: 30.0
    scan_z_min: 0.03
    scan_z_max: 1.50
    scan_range_min: 0.50

# 未登记机器人类型的保守回退（会打印告警）
default_profile:
  motion_model: differential
  robot_radius: 0.35
  lidar_xyz: [0.0, 0.0, 0.40]
  lidar_rpy: [0.0, 0.0, 0.0]
  sensor_mounts:
    orsus: {xyz: [0.0, 0.0, 0.40], rpy: [0.0, 0.0, 0.0]}
    lidar: {xyz: [0.0, 0.0, 0.40], rpy: [0.0, 0.0, 0.0]}
  max_vel_x: 0.5
  max_vel_theta: 1.0
  acc_lim_x: 2.0
  acc_lim_theta: 2.5
  min_vel_x: 0.0
  scan_z_min: -0.30
  scan_z_max: 1.50
  scan_range_min: 0.40

# ─────────────────────────────────────────────────────────────
# 场景 → provider usd 根目录下的 2D 占用地图 yaml。
# 根目录优先使用 EAI_USD_ROOT，否则使用 <repo>/usd。
# 每个场景地图由 provider 安装到 scene/<key>/，不属于算法或 demo 源码。
scene_maps:
  plane: scene/plane/plane_map.yaml
  warehouse: scene/warehouse/warehouse_map.yaml
  factory: scene/factory/factory_map.yaml
  airs: scene/airs/airs_map.yaml
  desert: scene/desert/desert_map.yaml
  hospital: scene/hospital/hospital_map.yaml

# 场景无地图时的默认（None 表示需要用户显式 --map 或先建图）
scene_map_default: null
