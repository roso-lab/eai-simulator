# EAI 仿真器 Nav2 参数【模板】—— 由 nav2_setup.py 按 机器人类型+场景 生成实际文件
# @@占位符@@ 会被替换：ROBOT(实例名/命名空间), MOTION_MODEL, POSE_X/Y, ROBOT_RADIUS,
#   MAX_VEL_X/THETA, ACC_LIM_X/THETA, MIN_VEL_X, MIN_SPEED_XY,
#   XY_GOAL_TOLERANCE, YAW_GOAL_TOLERANCE, PROGRESS_REQUIRED_MOVEMENT_RADIUS,
#   PROGRESS_MOVEMENT_TIME_ALLOWANCE, INFLATION_RADIUS
# 话题约定：/<ROBOT>/scan, /<ROBOT>/cmd_vel, /<ROBOT>/odometry
# TF 链: map -> odom -> base_link -> lidar_link (map->odom 由 amcl 提供, odom->base_link 由 tf_bridge 提供)

amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 30.0
    laser_min_range: 0.2
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "@@MOTION_MODEL@@"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /@@ROBOT@@/scan
    # 初始位姿：由活动仿真运行时快照或显式 --pose 注入（世界坐标 = 地图坐标）
    set_initial_pose: true
    initial_pose:
      x: @@POSE_X@@
      y: @@POSE_Y@@
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /@@ROBOT@@/odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    # 本 Nav2 版本(1.1.20)使用默认 BT XML，无需声明 navigators 插件列表

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /@@ROBOT@@/odometry
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: @@PROGRESS_REQUIRED_MOVEMENT_RADIUS@@
      movement_time_allowance: @@PROGRESS_MOVEMENT_TIME_ALLOWANCE@@
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: @@XY_GOAL_TOLERANCE@@
      yaw_goal_tolerance: @@YAW_GOAL_TOLERANCE@@
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: @@MIN_VEL_X@@
      min_vel_y: 0.0
      max_vel_x: @@MAX_VEL_X@@
      max_vel_y: 0.0
      max_vel_theta: @@MAX_VEL_THETA@@
      min_speed_xy: @@MIN_SPEED_XY@@
      max_speed_xy: @@MAX_VEL_X@@
      min_speed_theta: 0.0
      acc_lim_x: @@ACC_LIM_X@@
      acc_lim_y: 0.0
      acc_lim_theta: @@ACC_LIM_THETA@@
      decel_lim_x: -@@ACC_LIM_X@@
      decel_lim_y: 0.0
      decel_lim_theta: -@@ACC_LIM_THETA@@
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: @@XY_GOAL_TOLERANCE@@
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: @@MAX_VEL_THETA@@
    min_rotational_vel: 0.4
    rotational_acc_lim: @@ACC_LIM_THETA@@

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [@@MAX_VEL_X@@, 0.0, @@MAX_VEL_THETA@@]
    min_velocity: [@@MIN_VEL_X@@, 0.0, -@@MAX_VEL_THETA@@]
    max_accel: [@@ACC_LIM_X@@, 0.0, @@ACC_LIM_THETA@@]
    max_decel: [-@@ACC_LIM_X@@, 0.0, -@@ACC_LIM_THETA@@]
    odom_topic: "/@@ROBOT@@/odometry"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 1.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: @@ROBOT_RADIUS@@
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /@@ROBOT@@/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
          obstacle_max_range: 28.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: @@INFLATION_RADIUS@@
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 1.0
      robot_radius: @@ROBOT_RADIUS@@
      resolution: 0.05
      track_unknown_space: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /@@ROBOT@@/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
          obstacle_max_range: 28.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: @@INFLATION_RADIUS@@
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True
