name: Deploy Documentation

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx furo myst-parser sphinx-autodoc-typehints

      - name: Build documentation
        env:
          EAI_GITHUB_OAUTH_URL: ${{ vars.EAI_GITHUB_OAUTH_URL }}
        run: |
          cd docs
          make clean
          make html SPHINXOPTS="-W --keep-going"

      - name: Verify Env DIY tutorial artifact
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path("docs/build/html")
          tutorial = root / "env_diy_tutorial.html"
          images = sorted((root / "env-diy-assets").rglob("*.png"))
          signature = b"\x89PNG\r\n\x1a\n"
          invalid = [str(path.relative_to(root)) for path in images if path.read_bytes()[:8] != signature]

          if not tutorial.is_file():
              raise SystemExit("missing built Env DIY tutorial HTML")

          references = set(re.findall(
              r"env-diy-assets/[A-Za-z0-9_./-]+\.png",
              tutorial.read_text(encoding="utf-8"),
          ))
          built = {path.relative_to(root).as_posix() for path in images}
          missing = sorted(references - built)
          unexpected = sorted(built - references)

          if not references:
              raise SystemExit("Env DIY tutorial contains no PNG asset references")
          if missing or unexpected:
              raise SystemExit(
                  f"Env DIY PNG mismatch: missing={missing}, unexpected={unexpected}"
              )
          if invalid:
              raise SystemExit(f"invalid built PNG files: {invalid}")
          print(f"verified Env DIY tutorial HTML and {len(images)} referenced PNG assets")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
