name: Synchronize GitLab and GitHub

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/sync-gitlab.yml"
  workflow_dispatch:
    inputs:
      direction:
        description: Synchronization direction
        required: true
        default: pull
        type: choice
        options:
          - pull
          - push

permissions:
  contents: write

concurrency:
  group: gitlab-github-sync
  cancel-in-progress: false

jobs:
  pull-from-gitlab:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.direction == 'pull')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: "1"

    steps:
      - name: Configure GitLab SSH access
        env:
          GITLAB_SSH_PRIVATE_KEY: ${{ secrets.GITLAB_SSH_PRIVATE_KEY }}
        run: |
          test -n "$GITLAB_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$GITLAB_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' \
            '[rosolab.com]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICYP3DzVR9pUBu7oHl0himtciQN0RFZAmFydNuCQT86S' \
            > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Pull GitLab develop and update GitHub main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir repository
          cd repository

          git init --initial-branch=main
          git remote add github \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch github main
          git checkout --detach FETCH_HEAD
          github_sha=$(git rev-parse HEAD)

          git remote add gitlab \
            'ssh://git@rosolab.com:2222/roso-lab/eai-simulator.git'
          git fetch gitlab \
            develop:refs/remotes/gitlab/develop

          merge_base=$(git merge-base HEAD refs/remotes/gitlab/develop)
          if ! git diff --quiet "$merge_base" HEAD -- \
            . ':(exclude).github/workflows/sync-gitlab.yml'; then
            echo "::warning::GitHub main has changes awaiting a GitLab merge request; pull skipped."
            exit 0
          fi

          if git diff --quiet HEAD refs/remotes/gitlab/develop -- \
            . ':(exclude).github/workflows/sync-gitlab.yml' && \
            git merge-base --is-ancestor refs/remotes/gitlab/develop HEAD; then
            exit 0
          fi

          git lfs fetch gitlab refs/remotes/gitlab/develop
          cp .github/workflows/sync-gitlab.yml \
            "$RUNNER_TEMP/sync-gitlab.yml"
          git reset --hard refs/remotes/gitlab/develop
          install -m 755 -d .github/workflows
          cp "$RUNNER_TEMP/sync-gitlab.yml" \
            .github/workflows/sync-gitlab.yml

          git add .github/workflows/sync-gitlab.yml
          git config user.name github-actions\[bot\]
          git config user.email \
            41898282+github-actions\[bot\]@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m "chore: preserve GitHub sync workflow"
          fi

          git push \
            --force-with-lease="refs/heads/main:${github_sha}" \
            github HEAD:refs/heads/main

  push-to-gitlab:
    if: >-
      (github.event_name == 'push' && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'workflow_dispatch' && inputs.direction == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: "1"

    steps:
      - name: Configure GitLab SSH access
        env:
          GITLAB_SSH_PRIVATE_KEY: ${{ secrets.GITLAB_SSH_PRIVATE_KEY }}
        run: |
          test -n "$GITLAB_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$GITLAB_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' \
            '[rosolab.com]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICYP3DzVR9pUBu7oHl0himtciQN0RFZAmFydNuCQT86S' \
            > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Push GitHub main to a GitLab merge request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir repository
          cd repository

          git init --initial-branch=main
          git remote add github \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch github main:refs/remotes/github/main

          git remote add gitlab \
            'ssh://git@rosolab.com:2222/roso-lab/eai-simulator.git'
          git fetch gitlab \
            develop:refs/remotes/gitlab/develop

          if git diff --quiet refs/remotes/github/main \
            refs/remotes/gitlab/develop -- \
            . ':(exclude).github/workflows/sync-gitlab.yml'; then
            exit 0
          fi

          git lfs fetch github refs/remotes/github/main
          git checkout --detach refs/remotes/github/main
          git rm --ignore-unmatch .github/workflows/sync-gitlab.yml
          git config user.name github-actions\[bot\]
          git config user.email \
            41898282+github-actions\[bot\]@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m "chore: exclude GitHub sync workflow from GitLab"
          fi

          sync_sha=$(git ls-remote --heads gitlab \
            refs/heads/github-sync/main | cut -f1)
          if [ -n "$sync_sha" ]; then
            lease="--force-with-lease=refs/heads/github-sync/main:${sync_sha}"
          else
            lease="--force-with-lease=refs/heads/github-sync/main:"
          fi

          git push "$lease" \
            -o merge_request.create \
            -o merge_request.target=develop \
            -o merge_request.remove_source_branch \
            -o "merge_request.title=Sync GitHub main to GitLab develop" \
            -o "merge_request.description=Created automatically from GitHub. This branch is managed by GitHub Actions; resolve code conflicts in the source repository and do not squash the merge request." \
            gitlab HEAD:refs/heads/github-sync/main
