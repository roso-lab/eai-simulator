name: Synchronize GitLab and GitHub

on:
  schedule:
    - cron: "*/5 * * * *"
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      direction:
        description: Synchronization direction
        required: true
        default: pull
        type: choice
        options:
          - pull
          - pr
      pr_number:
        description: GitHub PR number (required for PR synchronization)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: >-
    gitlab-github-sync-${{
      github.event.pull_request.number || inputs.pr_number || 'repository'
    }}
  cancel-in-progress: false

jobs:
  pull-from-gitlab:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.direction == 'pull')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: "1"

    steps:
      - name: Configure GitLab SSH access
        env:
          GITLAB_SSH_PRIVATE_KEY: ${{ secrets.GITLAB_SSH_PRIVATE_KEY }}
        run: |
          test -n "$GITLAB_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$GITLAB_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' \
            '[rosolab.com]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICYP3DzVR9pUBu7oHl0himtciQN0RFZAmFydNuCQT86S' \
            > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Pull GitLab develop and update GitHub main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir repository
          cd repository

          git init --initial-branch=main
          git remote add github \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch github main
          git checkout --detach FETCH_HEAD
          github_sha=$(git rev-parse HEAD)

          git remote add gitlab \
            'ssh://git@rosolab.com:2222/roso-lab/eai-simulator.git'
          git fetch gitlab \
            develop:refs/remotes/gitlab/develop

          merge_base=$(git merge-base HEAD refs/remotes/gitlab/develop)
          if ! git diff --quiet "$merge_base" HEAD -- \
            . ':(exclude).github/workflows/sync-gitlab.yml'; then
            echo "::warning::GitHub main has changes awaiting a GitLab merge request; pull skipped."
            exit 0
          fi

          if git diff --quiet HEAD refs/remotes/gitlab/develop -- \
            . ':(exclude).github/workflows/sync-gitlab.yml' && \
            git merge-base --is-ancestor refs/remotes/gitlab/develop HEAD; then
            exit 0
          fi

          git lfs fetch gitlab refs/remotes/gitlab/develop
          cp .github/workflows/sync-gitlab.yml \
            "$RUNNER_TEMP/sync-gitlab.yml"
          git reset --hard refs/remotes/gitlab/develop
          install -m 755 -d .github/workflows
          cp "$RUNNER_TEMP/sync-gitlab.yml" \
            .github/workflows/sync-gitlab.yml

          git add .github/workflows/sync-gitlab.yml
          git config user.name github-actions\[bot\]
          git config user.email \
            41898282+github-actions\[bot\]@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m "chore: preserve GitHub sync workflow"
          fi

          git push \
            --force-with-lease="refs/heads/main:${github_sha}" \
            github HEAD:refs/heads/main

  mirror-github-pr-to-gitlab:
    if: >-
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.draft == false) ||
      (github.event_name == 'workflow_dispatch' && inputs.direction == 'pr')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

    steps:
      - name: Configure GitLab SSH access
        env:
          GITLAB_SSH_PRIVATE_KEY: ${{ secrets.GITLAB_SSH_PRIVATE_KEY }}
        run: |
          test -n "$GITLAB_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$GITLAB_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' \
            '[rosolab.com]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICYP3DzVR9pUBu7oHl0himtciQN0RFZAmFydNuCQT86S' \
            > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Mirror GitHub PR to a GitLab merge request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "::error::A numeric GitHub PR number is required."
              exit 1
              ;;
          esac

          pr_title=$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .title)
          pr_url="https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"

          mkdir repository
          cd repository

          git init --initial-branch=main
          git remote add github \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config remote.github.lfsurl \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git/info/lfs"
          git fetch github \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/github/pr/${PR_NUMBER}"

          git remote add gitlab \
            'ssh://git@rosolab.com:2222/roso-lab/eai-simulator.git'
          git fetch gitlab \
            develop:refs/remotes/gitlab/develop

          pr_ref="refs/remotes/github/pr/${PR_NUMBER}"
          if git diff --quiet "$pr_ref" refs/remotes/gitlab/develop -- \
            . ':(exclude).github/workflows/sync-gitlab.yml'; then
            echo "::notice::The pull request has no changes to mirror to GitLab."
            exit 0
          fi

          git lfs fetch github "$pr_ref"
          git checkout -b gitlab-review refs/remotes/gitlab/develop
          git config user.name github-actions\[bot\]
          git config user.email \
            41898282+github-actions\[bot\]@users.noreply.github.com
          if ! git merge --no-ff --no-commit "$pr_ref"; then
            git merge --abort
            echo "::error::The GitHub PR conflicts with GitLab develop. Update the GitHub PR and try again."
            exit 1
          fi

          git rm --ignore-unmatch .github/workflows/sync-gitlab.yml
          git commit -m "chore: stage GitHub PR #${PR_NUMBER} for GitLab review"

          gitlab_branch="github-pr/${PR_NUMBER}"
          sync_sha=$(git ls-remote --heads gitlab \
            "refs/heads/${gitlab_branch}" | cut -f1)
          if [ -n "$sync_sha" ]; then
            lease="--force-with-lease=refs/heads/${gitlab_branch}:${sync_sha}"
          else
            lease="--force-with-lease=refs/heads/${gitlab_branch}:"
          fi

          mr_title="GitHub PR #${PR_NUMBER}: ${pr_title:0:200}"
          git push "$lease" \
            -o merge_request.create \
            -o merge_request.target=develop \
            -o merge_request.remove_source_branch \
            -o "merge_request.title=${mr_title}" \
            -o "merge_request.description=Mirrors ${pr_url}. This branch is managed by GitHub Actions; review and merge this MR without squashing to merge the GitHub PR." \
            gitlab "HEAD:refs/heads/${gitlab_branch}"
