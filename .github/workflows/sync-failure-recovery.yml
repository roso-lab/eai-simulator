name: Recover synchronization failures

on:
  workflow_run:
    workflows:
      - Synchronize GitLab and GitHub
    types:
      - completed

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: synchronization-failure-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Retry, report, or close synchronization incident
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          issue_title='[automation] GitLab/GitHub synchronization failure'

          find_incident_issue() {
            gh api --paginate --method GET \
              "repos/${GITHUB_REPOSITORY}/issues" \
              -f state=all \
              -f per_page=100 \
              --jq ".[] | select(
                .pull_request == null and
                .title == \"${issue_title}\"
              ) | [.number, .state] | @tsv" | sed -n '1p'
          }

          close_incident() {
            IFS=$'\t' read -r issue_number issue_state \
              <<<"$(find_incident_issue)"
            if [ -z "$issue_number" ] || [ "$issue_state" != open ]; then
              exit 0
            fi

            gh issue comment "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Synchronization recovered in ${RUN_URL} (attempt ${RUN_ATTEMPT})."
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --reason completed
          }

          report_incident() {
            jobs=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs")
            failure_summary=$(jq -r '
              [
                .jobs[]
                | select(.conclusion != "success" and .conclusion != "skipped")
                | "- Job: `\(.name)` (\(.conclusion // "unknown"))",
                  (
                    .steps[]?
                    | select(.conclusion != "success" and .conclusion != "skipped")
                    | "  - Step: `\(.name)` (\(.conclusion // "unknown"))"
                  )
              ]
              | if length == 0 then "- No failed job metadata was available." else .[] end
            ' <<<"$jobs")

            issue_body=$(printf '%s\n' \
              'The GitLab/GitHub synchronization failed after one automatic retry.' \
              '' \
              "- Run: ${RUN_URL}" \
              "- Attempt: ${RUN_ATTEMPT}" \
              "- Event: \`${RUN_EVENT}\`" \
              "- Branch: \`${RUN_BRANCH:-unknown}\`" \
              "- Commit: \`${RUN_SHA}\`" \
              '' \
              'Failed jobs and steps:' \
              "$failure_summary")

            IFS=$'\t' read -r issue_number issue_state \
              <<<"$(find_incident_issue)"
            if [ -n "$issue_number" ]; then
              if [ "$issue_state" != open ]; then
                gh issue reopen "$issue_number" \
                  --repo "$GITHUB_REPOSITORY"
              fi
              gh issue comment "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --body "$issue_body"
            else
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$issue_title" \
                --body "$issue_body"
            fi
          }

          case "$RUN_CONCLUSION" in
            success)
              close_incident
              ;;
            failure|timed_out|startup_failure)
              if [ "$RUN_ATTEMPT" -eq 1 ]; then
                if gh api --method POST \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"; then
                  echo "::notice::Requested one retry for ${RUN_URL}."
                else
                  echo "::error::The failed workflow could not be retried."
                  report_incident
                  exit 1
                fi
              else
                report_incident
              fi
              ;;
            *)
              echo "::notice::No recovery action for conclusion ${RUN_CONCLUSION}."
              ;;
          esac
