name: Documentation issue
description: Report missing, outdated, or confusing documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: page
    attributes:
      label: Documentation page or file
      placeholder: "README.md, CONTRIBUTING.md, or a published docs URL"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or wrong?
      placeholder: Describe the missing, outdated, incorrect, or confusing content.
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested improvement
      placeholder: Share the wording, command, screenshot, or example you expected to see.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing GitHub Issues and Discussions.
          required: true
